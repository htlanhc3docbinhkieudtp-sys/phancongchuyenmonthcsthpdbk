<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="lotusGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <!-- Text Paths for circular text -->
    <path id="topTextArc" d="M 65 256 A 191 191 0 0 1 447 256" fill="none" />
    <path id="bottomTextArc" d="M 447 256 A 191 191 0 0 1 65 256" fill="none" />
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="256" cy="256" r="252" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Circular Text -->
  <text font-family="Liberation Sans, Arial, sans-serif" font-size="20.5" font-weight="bold" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SỞ GIÁO DỤC VÀ ĐÀO TẠO ĐỒNG THÁP
    </textPath>
  </text>

  <text font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      TRƯỜNG THCS VÀ THPT ĐỐC BINH KIỀU
    </textPath>
  </text>

  <!-- Star dividers on left and right -->
  <g fill="url(#goldGrad)">
    <polygon points="60,256 63,246 73,246 65,252 68,262 60,256 52,262 55,252 47,246 57,246" transform="translate(-8, 0)" />
    <polygon points="452,256 455,246 465,246 457,252 460,262 452,256 444,262 447,252 439,246 449,246" transform="translate(8, 0)" />
  </g>

  <!-- Center Circle Body -->
  <circle cx="256" cy="256" r="165" fill="url(#centerGrad)" />

  <!-- Sun Rays in Center -->
  <g opacity="0.2" fill="#ffffff">
    <polygon points="256,256 240,95 272,95" />
    <polygon points="256,256 160,110 185,95" />
    <polygon points="256,256 352,110 327,95" />
    <polygon points="256,256 110,160 125,140" />
    <polygon points="256,256 402,160 387,140" />
  </g>

  <!-- Open Book of Knowledge -->
  <g id="open-book" transform="translate(256, 275)">
    <!-- Left Page -->
    <path d="M 0 10 C -40 -5 -80 -2 -115 15 L -115 -45 C -80 -62 -40 -65 0 -50 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Right Page -->
    <path d="M 0 10 C 40 -5 80 -2 115 15 L 115 -45 C 80 -62 40 -65 0 -50 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Book Spine & Thickness Base -->
    <path d="M -115 15 C -80 -2 -40 -5 0 10 C 40 -5 80 -2 115 15 L 115 22 C 80 5 40 2 0 17 C -40 2 -80 5 -115 22 Z" fill="url(#goldGrad)" />
    <!-- Lines on Pages -->
    <line x1="-100" y1="-30" x2="-20" y2="-38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-100" y1="-15" x2="-20" y2="-23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-100" y1="0" x2="-30" y2="-8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="-38" x2="100" y2="-30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="-23" x2="100" y2="-15" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="-8" x2="100" y2="0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Flaming Torch of Wisdom (Ngọn đuốc) -->
  <g id="torch" transform="translate(256, 175)">
    <!-- Flame Outer -->
    <path d="M 0 -65 C 25 -45 35 -20 22 5 C 15 18 5 25 0 35 C -5 25 -15 18 -22 5 C -35 -20 -25 -45 0 -65 Z" fill="url(#flameGrad)" />
    <!-- Flame Core -->
    <path d="M 0 -45 C 15 -30 20 -15 12 5 C 8 12 3 18 0 25 C -3 18 -8 12 -12 5 C -20 -15 -15 -30 0 -45 Z" fill="#fef08a" opacity="0.9" />
    <!-- Torch Bowl -->
    <path d="M -22 30 L 22 30 L 16 52 L -16 52 Z" fill="url(#goldGrad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Torch Handle -->
    <path d="M -8 52 L 8 52 L 5 95 L -5 95 Z" fill="url(#goldGrad)" stroke="#92400e" stroke-width="1" />
    <!-- Rings on handle -->
    <line x1="-7" y1="65" x2="7" y2="65" stroke="#78350f" stroke-width="2" />
    <line x1="-6" y1="80" x2="6" y2="80" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Lotus Flower Base (Hoa sen Đồng Tháp) -->
  <g id="lotus" transform="translate(256, 340)">
    <!-- Leaves -->
    <path d="M 0 15 C -45 15 -80 -5 -100 -20 C -70 5 -35 25 0 25 C 35 25 70 5 100 -20 C 80 -5 45 15 0 15 Z" fill="#15803d" />
    <!-- Outer Petals -->
    <path d="M -45 -5 C -65 -25 -50 -50 -35 -55 C -30 -35 -25 -15 -15 5 Z" fill="url(#lotusGrad)" opacity="0.85" />
    <path d="M 45 -5 C 65 -25 50 -50 35 -55 C 30 -35 25 -15 15 5 Z" fill="url(#lotusGrad)" opacity="0.85" />
    <!-- Inner Petals -->
    <path d="M -25 5 C -40 -20 -30 -45 -18 -55 C -12 -35 -8 -15 0 15 Z" fill="url(#lotusGrad)" />
    <path d="M 25 5 C 40 -20 30 -45 18 -55 C 12 -35 8 -15 0 15 Z" fill="url(#lotusGrad)" />
    <!-- Center Petal -->
    <path d="M 0 -65 C 15 -45 18 -20 0 15 C -18 -20 -15 -45 0 -65 Z" fill="#f472b6" />
  </g>

  <!-- Golden Ribbon Banner with School Name -->
  <g id="ribbon" transform="translate(256, 385)">
    <!-- Ribbon Ends -->
    <path d="M -135 5 L -165 -15 L -140 -35 L -115 -10 Z" fill="#b45309" />
    <path d="M 135 5 L 165 -15 L 140 -35 L 115 -10 Z" fill="#b45309" />
    <!-- Ribbon Body -->
    <path d="M -130 -10 C -60 -25 60 -25 130 -10 L 120 18 C 60 5 -60 5 -120 18 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    <text x="0" y="8" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="2">
      ĐỐC BINH KIỀU
    </text>
  </g>
</svg>